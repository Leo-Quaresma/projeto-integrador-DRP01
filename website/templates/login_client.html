{% extends "base.html" %} {% block title %}Login Cliente - FOTECTA: Como conectar fotógrafos com novos clientes{% endblock %}
{%block content%}

<!-- Login é feito via post para não expor credenciais na query string/url-->
<form method="POST">
    <h3 align="center">LOGIN DO CLIENTE</h3>
    <div class="form-group">
        <label for="email">Endereço de Email</label>
        <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="Digite seu Email"
        />
    </div>
    <div class="form-group">
        <label for="password1">Digite sua senha</label>
        <input
            type="password"
            class="form-control"
            id="password1"
            name="password1"
            placeholder="Digite sua senha"
        />
    </div>
    <br/>
    <button type="submit" class="btn btn-primary">Entrar como Cliente</button>
</form>
{%endblock%}
